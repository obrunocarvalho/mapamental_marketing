<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nivelamento, Gestão de Produtos e Marcas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05070F;--bg2:#0A0D1A;
  --sf:rgba(255,255,255,0.035);--sfh:rgba(255,255,255,0.065);
  --bd:rgba(255,255,255,0.07);--bdh:rgba(255,255,255,0.16);
  --tx:#EEF2FF;--mu:rgba(238,242,255,0.45);--mu2:rgba(238,242,255,0.22);
  --red:#FF6B6B;--teal:#00E5CC;--gold:#FFD93D;--vio:#B77FFF;--rose:#FF7EB3;
  --pw:440px;--hh:58px
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;cursor:none}

/* ── CURSOR ── */
#cur{position:fixed;width:10px;height:10px;background:var(--tx);border-radius:50%;pointer-events:none;z-index:9999;mix-blend-mode:difference;transform:translate(-50%,-50%);transition:width .15s,height .15s}
#curR{position:fixed;width:34px;height:34px;border:1.5px solid rgba(238,242,255,0.3);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .25s cubic-bezier(.23,1,.32,1),height .25s cubic-bezier(.23,1,.32,1)}
body.ch #cur{width:6px;height:6px}
body.ch #curR{width:50px;height:50px;border-color:rgba(238,242,255,0.5)}

#three-bg{position:fixed;inset:0;z-index:0}
#noise{position:fixed;inset:0;z-index:1;opacity:.022;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
#ttip{position:fixed;z-index:5000;background:rgba(5,7,15,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:8px;padding:6px 11px;font-size:.73rem;pointer-events:none;opacity:0;transition:opacity .18s;white-space:nowrap}

/* ── APP SHELL ── */
#app{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column}
#hdr{height:var(--hh);display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:rgba(5,7,15,.72);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);flex-shrink:0}
.hgem{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--red),var(--vio));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 18px rgba(255,107,107,.28)}
.hgem svg{width:14px;height:14px}
.hlogo{display:flex;align-items:center;gap:11px}
.htitle{font-family:'Syne',sans-serif;font-size:.88rem;font-weight:700;letter-spacing:.02em}
.hsub{font-size:.7rem;color:var(--mu);margin-top:1px}
.hright{display:flex;align-items:center;gap:8px}
.hchip{padding:4px 13px;border-radius:100px;border:1px solid var(--bd);background:var(--sf);font-size:.7rem;color:var(--mu);backdrop-filter:blur(8px)}
.hhint{font-size:.7rem;color:var(--mu2);display:flex;align-items:center;gap:5px}
.hhint span{animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* ── MAIN ── */
#main{flex:1;display:flex;overflow:hidden;position:relative}
#mapw{flex:1;position:relative;overflow:hidden;touch-action:none}

/* Overlay — only becomes visible on mobile via JS adding .show */
#panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);pointer-events:none;z-index:49;transition:background .35s}
#panel-overlay.show{background:rgba(0,0,0,.55);pointer-events:all}
#mindmap{width:100%;height:100%}

/* ── LEGEND ── */
#leg{position:absolute;bottom:22px;left:22px;background:rgba(5,7,15,.6);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:11px;padding:12px 14px;display:flex;gap:12px;flex-wrap:wrap;max-width:380px}
.li{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--mu)}
.ld{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ── ZOOM ── */
#zc{position:absolute;bottom:22px;right:22px;display:flex;flex-direction:column;gap:4px}
.zb{width:34px;height:34px;background:rgba(5,7,15,.6);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:8px;color:var(--mu);font-size:1.1rem;display:flex;align-items:center;justify-content:center;cursor:none;transition:background .2s,color .2s}
.zb:hover{background:var(--sfh);color:var(--tx)}

/* ── PANEL ── */
#panel{position:fixed;top:var(--hh);right:0;bottom:0;width:var(--pw);background:rgba(5,7,15,.92);backdrop-filter:blur(28px) saturate(1.3);border-left:1px solid var(--bd);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .42s cubic-bezier(.23,1,.32,1);overflow:hidden;z-index:50;box-shadow:-8px 0 32px rgba(0,0,0,.4)}
#panel.open{transform:translateX(0)}
#phdr{padding:18px 20px 15px;border-bottom:1px solid var(--bd);flex-shrink:0;position:relative}
#pclose{position:absolute;top:16px;right:16px;width:26px;height:26px;border-radius:7px;background:var(--sf);border:1px solid var(--bd);color:var(--mu);font-size:.95rem;display:flex;align-items:center;justify-content:center;cursor:none;transition:all .2s}
#pclose:hover{background:var(--sfh);color:var(--tx)}
#pico{font-size:0;line-height:0;margin-bottom:8px;display:flex;align-items:center}
#pico svg{width:22px;height:22px}
#ptitle{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:700}
#psub{font-size:.75rem;color:var(--mu);margin-top:2px}
#pbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 18px 28px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
#pbody::-webkit-scrollbar{width:3px}
#pbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

/* ── PANEL COMPONENTS ── */
.pq{background:var(--sf);border-left:2.5px solid var(--c,#fff);border-radius:0 9px 9px 0;padding:10px 13px;font-style:italic;font-size:.8rem;color:var(--tx);margin-bottom:13px;line-height:1.6}
.plbl{font-family:'Syne',sans-serif;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--c,var(--mu));margin-bottom:7px}
.psec{margin-bottom:16px}
.pg{display:grid;gap:6px}
.pg2{grid-template-columns:1fr 1fr}
.pg3{grid-template-columns:1fr 1fr 1fr}
.pc{background:var(--sf);border:1px solid var(--bd);border-radius:9px;padding:11px;font-size:.77rem;transition:background .2s;line-height:1.5}
.pc:hover{background:var(--sfh)}
.pc strong{display:block;font-size:.78rem;margin-bottom:2px}
.pul{list-style:none;padding:0}
.pul li{padding:5px 0 5px 15px;position:relative;font-size:.78rem;color:rgba(238,242,255,.78);border-bottom:1px solid rgba(255,255,255,.04)}
.pul li:last-child{border-bottom:none}
.pul li::before{content:'▸';position:absolute;left:0;color:var(--c,#fff);font-size:.68rem;top:6px}
.pdup{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:13px}
.pdb{padding:11px;border-radius:9px;font-size:.77rem}
.pdb h4{font-size:.78rem;margin-bottom:4px}
.pdb p{color:var(--mu);line-height:1.5}

/* Pyramid */
.pyrw{display:flex;flex-direction:column;align-items:center;gap:3px;margin:8px 0 12px}
.prw{padding:8px 11px;text-align:center;border-radius:7px;font-size:.74rem;font-weight:600;cursor:default;transition:transform .18s}
.prw:hover{transform:scaleX(1.04)}
.prn{font-family:'JetBrains Mono',monospace;font-size:.6rem;opacity:.55;display:block}

/* BCG */
.bcgg{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:8px 0 12px}
.bcgq{padding:13px 11px;border-radius:9px;text-align:center;cursor:default;transition:transform .18s;position:relative;overflow:hidden}
.bcgq:hover{transform:scale(1.03)}
.bcgq::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.05),transparent);pointer-events:none}
.bcge{font-size:1.5rem;display:block;margin-bottom:4px}
.bcgn{font-weight:700;font-size:.8rem;display:block;margin-bottom:3px}
.bcgd{font-size:.67rem;opacity:.68;line-height:1.4}
.bcgax{display:flex;justify-content:space-between;font-size:.63rem;color:var(--mu2);font-family:'JetBrains Mono',monospace;margin-top:5px;padding:0 3px}

/* Ladder */
.ladw{display:flex;flex-direction:column;gap:3px;margin:8px 0 12px}
.lads{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;transition:transform .14s;cursor:default}
.lads:hover{transform:translateX(3px)}
.ladn{font-family:'JetBrains Mono',monospace;font-size:.88rem;font-weight:600;min-width:20px}

/* VRIO */
.vriot{width:100%;border-collapse:separate;border-spacing:0 3px;margin:7px 0 12px}
.vriot th{font-family:'Syne',sans-serif;font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--c,var(--mu));padding:5px;text-align:left}
.vriot td{padding:8px 10px;background:var(--sf);font-size:.75rem}
.vriot tr td:first-child{border-radius:7px 0 0 7px;font-weight:600;min-width:75px}
.vriot tr td:last-child{border-radius:0 7px 7px 0;color:var(--mu)}

/* Flow stages */
.fsw{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin:7px 0 12px}
.fss{padding:9px 7px;border-radius:9px;text-align:center;font-size:.68rem;font-weight:600}
.fsn{font-family:'JetBrains Mono',monospace;font-size:.95rem;display:block;margin-bottom:2px}

/* Strategy grid */
.stg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:7px 0 12px}
.stc{padding:11px;border-radius:9px;text-align:center;font-size:.74rem;border:1px solid rgba(255,255,255,.07);transition:transform .18s;cursor:default}
.stc:hover{transform:translateY(-2px)}
.sti{margin-bottom:8px;display:flex;justify-content:center}
.sti svg{width:20px;height:20px}
.stn{font-weight:700;display:block;margin-bottom:3px}
.std{color:var(--mu);font-size:.67rem;line-height:1.4}

/* Bridge */
.brid{display:flex;gap:3px;margin:7px 0 14px}
.brit{flex:1;padding:8px 5px;border-radius:7px;text-align:center;font-size:.68rem;font-weight:600;border:1px solid rgba(255,255,255,.08)}
.bria{color:var(--mu2);font-size:.95rem;align-self:center;flex-shrink:0}

/* CVP */
.cvpw{margin:8px 0 12px;background:rgba(255,255,255,.025);border-radius:10px;padding:12px 8px 10px;position:relative}
canvas#cvpC{width:100%!important;display:block}
.cvpph{display:flex;margin-top:5px;border-top:1px solid rgba(255,255,255,.05);padding-top:5px}
.cvppl{flex:1;text-align:center;font-size:.62rem;font-weight:600;padding:2px}

/* Loading */
#ld{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s,visibility .6s}
#ld.gone{opacity:0;visibility:hidden}
.ldl{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,var(--red),var(--vio));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ldb{width:150px;height:2.5px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.ldp{height:100%;background:linear-gradient(90deg,var(--red),var(--vio),var(--teal));width:0;animation:ldgo 1.5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes ldgo{to{width:100%}}
.lds{font-size:.75rem;color:var(--mu2)}
/* ── DRAG HANDLE ── */
#pdrag{width:36px;height:4px;background:rgba(255,255,255,.18);border-radius:2px;margin:0 auto 14px;display:none}

/* Prevent text selection / tap-highlight on map */
#mindmap{-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
/* touch-action is NOT inherited — must be set on every SVG descendant */
#mindmap *{touch-action:none;-webkit-tap-highlight-color:transparent}
#mindmap text{pointer-events:none;-webkit-user-select:none;user-select:none}
.node-hit{outline:none;-webkit-tap-highlight-color:transparent}

/* ══════════════════════════════════════════
   MOBILE — App-like experience
══════════════════════════════════════════ */
@media(max-width:700px){
  /* Hide desktop cursor */
  #cur,#curR{display:none}
  body{cursor:auto}

  /* ── Header compact ── */
  #hdr{height:52px;padding:0 16px}
  .htitle{font-size:.78rem}
  .hsub{font-size:.64rem}
  .hright{display:none}
  .hgem{width:26px;height:26px;border-radius:6px}
  .hgem svg{width:12px;height:12px}

  /* ── Map takes full screen (panel is fixed, already out of flow) ── */
  #main{overflow:hidden}

  /* ── Panel as bottom sheet ── */
  #panel{
    top:auto;
    left:0;right:0;bottom:0;
    width:100%!important;
    height:75vh;
    border-left:none;
    border-top:1px solid rgba(255,255,255,.1);
    border-radius:20px 20px 0 0;
    transform:translateY(105%);
    box-shadow:0 -8px 40px rgba(0,0,0,.5);
    z-index:200;
  }
  #panel.open{transform:translateY(0)}
  /* Show overlay on mobile when panel is open */
  #panel-overlay{z-index:199}
  #pdrag{display:block}
  #phdr{padding:14px 18px 12px}
  #pbody{padding:12px 16px 40px;-webkit-overflow-scrolling:touch;overflow-y:scroll;touch-action:pan-y;overscroll-behavior:contain}

  /* ── Touch-friendly nodes — do NOT override touch-action:none ── */
  .node-hit{cursor:default}

  /* ── Zoom controls: bigger tap targets ── */
  #zc{bottom:18px;right:14px}
  .zb{width:42px;height:42px;border-radius:10px;font-size:1.2rem}

  /* ── Legend: hidden on mobile ── */
  #leg{display:none}

  /* ── Mobile hint: visible ── */
  #mob-hint{display:flex}

  /* ── Panel content adjustments ── */
  .pdup,.pg2{grid-template-columns:1fr}
  .stg{grid-template-columns:1fr 1fr}
  .brid{flex-wrap:wrap;gap:4px}
  .brit{min-width:60px}
  .bria{display:none}
  .fsw{grid-template-columns:1fr 1fr}

  /* ── Typography scale down ── */
  #ptitle{font-size:1.02rem}
  .pc,.pul li,.pdb p{font-size:.76rem}
  .plbl{font-size:.62rem}
}

/* ── Mobile hint bubble ── */
#mob-hint{
  display:none;
  position:absolute;
  bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(5,7,15,.8);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:100px;
  padding:8px 16px;
  font-size:.72rem;color:rgba(238,242,255,.6);
  white-space:nowrap;
  animation:hintFade 4s ease 2s forwards;
  pointer-events:none;
}
@keyframes hintFade{0%{opacity:1}70%{opacity:1}100%{opacity:0;visibility:hidden}}

/* ── Safe area bottom padding for iOS ── */
@supports(padding-bottom: env(safe-area-inset-bottom)){
  @media(max-width:700px){
    #pbody{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
    #zc{bottom:calc(18px + env(safe-area-inset-bottom))}
  }
}
</style>
</head>
<body>
<div id="cur"></div><div id="curR"></div>
<div id="ld"><div class="ldl">NGPM</div><div class="ldb"><div class="ldp"></div></div><div class="lds">Inicializando mapa mental...</div></div>
<canvas id="three-bg"></canvas>
<div id="noise"></div>
<div id="ttip"></div>

<div id="app">
  <div id="panel-overlay"></div>
  <header id="hdr">
    <div class="hlogo">
      <div class="hgem">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </div>
      <div><div class="htitle">Nivelamento, Gestão de Produtos e Marcas</div><div class="hsub">Prof. Rodrigo Cassimiro de Freitas · PUC Minas · 2026/1</div></div>
    </div>
    <div class="hright">
      <div class="hchip">Unidades 0 – II</div>
      <div class="hhint"><span>●</span> Clique nos nós para explorar o conteúdo</div>
    </div>
  </header>

  <div id="main">
    <div id="mapw">
      <svg id="mindmap"></svg>
      <div id="leg"></div>
      <div id="mob-hint">✦ Toque nos nós para explorar</div>
      <div id="zc">
        <button class="zb" id="zin">+</button>
        <button class="zb" id="zout">−</button>
        <button class="zb" id="zrst" style="font-size:.72rem">⊕</button>
      </div>
    </div>

    <div id="panel">
      <div id="phdr">
        <div id="pdrag"></div>
        <button id="pclose">✕</button>
        <div id="pico"></div>
        <div id="ptitle">—</div>
        <div id="psub">—</div>
      </div>
      <div id="pbody"></div>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════
   THREE.JS — NEURAL BACKGROUND
══════════════════════════════════════════════════════ */
(function(){
  const canvas=document.getElementById('three-bg');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.setClearColor(0x05070F,1);
  const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
  camera.position.z=300;
  const N=220;
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*680;pos[i*3+1]=(Math.random()-.5)*480;pos[i*3+2]=(Math.random()-.5)*280;}
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0x2a3060,size:1.5,transparent:true,opacity:.55,sizeAttenuation:true})));
  const lpos=[];
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
    const dx=pos[i*3]-pos[j*3],dy=pos[i*3+1]-pos[j*3+1];
    if(Math.sqrt(dx*dx+dy*dy)<85){lpos.push(pos[i*3],pos[i*3+1],pos[i*3+2],pos[j*3],pos[j*3+1],pos[j*3+2]);}
  }
  const lgeo=new THREE.BufferGeometry();
  lgeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(lpos),3));
  scene.add(new THREE.LineSegments(lgeo,new THREE.LineBasicMaterial({color:0x171d3a,transparent:true,opacity:.22})));
  let t=0;
  (function anim(){requestAnimationFrame(anim);t+=.0008;scene.rotation.y=t*.08;scene.rotation.x=Math.sin(t*.06)*.03;renderer.render(scene,camera);})();
  window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
})();

/* ══════════════════════════════════════════════════════
   CURSOR
══════════════════════════════════════════════════════ */
const c$=document.getElementById('cur'),cr$=document.getElementById('curR');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;c$.style.left=mx+'px';c$.style.top=my+'px';});
(function ac(){rx+=(mx-rx)*.11;ry+=(my-ry)*.11;cr$.style.left=rx+'px';cr$.style.top=ry+'px';requestAnimationFrame(ac);})();
function setCH(on){document.body.classList[on?'add':'remove']('ch');}
document.addEventListener('mouseover',e=>{if(e.target.closest('button,#mindmap .node-hit'))setCH(true);});
document.addEventListener('mouseout',e=>{if(e.target.closest('button,#mindmap .node-hit'))setCH(false);});

/* ══════════════════════════════════════════════════════
   TOOLTIP
══════════════════════════════════════════════════════ */
const tt$=document.getElementById('ttip');
function showTT(txt,color){tt$.textContent=txt;tt$.style.color=color;tt$.style.borderColor=color+'44';tt$.style.opacity='1';}
function hideTT(){tt$.style.opacity='0';}
document.addEventListener('mousemove',e=>{tt$.style.left=(e.clientX+16)+'px';tt$.style.top=(e.clientY-10)+'px';});

/* ══════════════════════════════════════════════════════
   ICON PATHS — PROFESSIONAL SVG (Lucide-style, 24×24)
══════════════════════════════════════════════════════ */
// Each icon is an array of {d, fill} objects
const ICONS = {
  // BookOpen

function makeSVGIcon(id, color, size){
  const scale = size/24;
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('transform',`scale(${scale}) translate(-12,-12)`);
  (ICONS[id]||[]).forEach(({d})=>{
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d);
    p.setAttribute('fill','none');
    p.setAttribute('stroke',color);
    p.setAttribute('stroke-width','1.8');
    p.setAttribute('stroke-linecap','round');
    p.setAttribute('stroke-linejoin','round');
    g.appendChild(p);
  });
  return g;
}

};

/* ══════════════════════════════════════════════════════
   D3 RADIAL TREE — FIXED GEOMETRY
══════════════════════════════════════════════════════ */
let svg, gMain, zoomBeh;
const ROOT_R=70, BRANCH_R=44;

function toXY(angle, r){
  return [r*Math.cos(angle-Math.PI/2), r*Math.sin(angle-Math.PI/2)];
}

// Returns the point on the edge of a source node (circle) in the direction of target
function edgePt(srcX,srcY,tgtX,tgtY,r){
  const dx=tgtX-srcX, dy=tgtY-srcY, d=Math.sqrt(dx*dx+dy*dy);
  if(d<0.001)return[srcX,srcY];
  return[srcX+dx/d*r, srcY+dy/d*r];
}

// Returns the point on the edge of a target (ellipse approximation for pills)
function edgePtEllipse(srcX,srcY,tgtX,tgtY,a,b){
  const dx=srcX-tgtX, dy=srcY-tgtY, d=Math.sqrt(dx*dx+dy*dy);
  if(d<0.001)return[tgtX,tgtY];
  const nx=dx/d, ny=dy/d;
  const t=1/Math.sqrt((nx/a)**2+(ny/b)**2);
  return[tgtX+nx*t, tgtY+ny*t];
}

function initMap(){
  const wrap=document.getElementById('mapw');
  const W=wrap.clientWidth, H=wrap.clientHeight;
  const cx=W/2, cy=H/2;
  
  // Garantir raio mínimo para que os nós nunca se aglomerem (mesmo no mobile)
  const baseDim = Math.max(W, 800); 
  const radius = baseDim / 2 * 0.82;

  svg=d3.select('#mindmap').attr('width',W).attr('height',H);

  // Fundo infinito opaco mas invisível para garantir captura firme de toque no iOS/Android
  svg.append('rect')
     .attr('width', '100%').attr('height', '100%')
     .attr('fill', '#000000').attr('opacity', 0);

  const defs=svg.append('defs');

  // Glow filter
  const gf=defs.append('filter').attr('id','glow').attr('x','-50%').attr('y','-50%').attr('width','200%').attr('height','200%');
  gf.append('feGaussianBlur').attr('stdDeviation','5').attr('result','blur');
  const fm=gf.append('feMerge');
  fm.append('feMergeNode').attr('in','blur');
  fm.append('feMergeNode').attr('in','SourceGraphic');

  // Radial gradients per branch
  Object.entries({red:C.red,teal:C.teal,gold:C.gold,vio:C.vio,rose:C.rose}).forEach(([k,col])=>{
    const rg=defs.append('radialGradient').attr('id','rg-'+k);
    rg.append('stop').attr('offset','0%').attr('stop-color',col).attr('stop-opacity',.32);
    rg.append('stop').attr('offset','100%').attr('stop-color',col).attr('stop-opacity',.04);
  });

  gMain=svg.append('g'); // No initial transform — zoom will set it

  // Calcular zoom out inicial para telas pequenas
  const mapTotalSize = radius * 2 + 200; // Espaço do raio + largura dos cards
  let initialScale = 1;
  if(W < mapTotalSize || H < mapTotalSize) {
    initialScale = Math.min(W / mapTotalSize, H / mapTotalSize) * 0.96; // 96% para não colar nas bordas
  }
  const minScale = Math.min(0.20, initialScale * 0.8);

  zoomBeh=d3.zoom().scaleExtent([minScale,3.5]).on('zoom',(ev)=>{
    gMain.attr('transform', ev.transform);
  });

  // Initialize centered and scaled
  const initT=d3.zoomIdentity.translate(cx,cy).scale(initialScale);
  window._mapInitT = initT; // Guardar estado inicial para o botão de reset

  d3.select('#mapw').call(zoomBeh)
    .call(zoomBeh.transform, initT)
    .on('dblclick.zoom',null);

  // Tree layout
  const tree=d3.tree()
    .size([2*Math.PI, radius])
    .separation((a,b)=>(a.parent===b.parent?1.3:2.6)/a.depth);

  // Add leaf dims to data before hierarchy
  function addDims(node){
    if(node.children) node.children.forEach(addDims);
    else node._dims=leafDims(node.name);
    return node;
  }
  const root=d3.hierarchy(addDims(JSON.parse(JSON.stringify(treeData))));
  tree(root);

  // Propagate dims back
  root.descendants().forEach(d=>{
    if(d.data._dims) d._dims=d.data._dims;
  });

  // ── LINKS ──────────────────────────────────────────
  const linkG=gMain.append('g').attr('class','links');

  root.links().forEach(link=>{
    const sd=link.source, td=link.target;
    const [sx,sy]=toXY(sd.x,sd.y);
    const [tx,ty]=toXY(td.x,td.y);

    const srcR = sd.depth===0 ? ROOT_R : BRANCH_R;

    let endPt;
    if(td.depth===1){
      endPt=edgePt(tx,ty,sx,sy,BRANCH_R);
    } else {
      const dims=td._dims||{w:60,h:26};
      endPt=edgePtEllipse(sx,sy,tx,ty,dims.w/2+2,dims.h/2+2);
    }
    const startPt=edgePt(sx,sy,tx,ty,srcR);

    const color=td.depth===1 ? C[td.data.ckey]||'#fff' : C[td.data.ckey]||'#fff';

    // Control pt: slight inward pull
    // Control point: midpoint with slight inward pull (20px toward origin)
    const rawCpx=(startPt[0]+endPt[0])/2, rawCpy=(startPt[1]+endPt[1])/2;
    const cpLen=Math.sqrt(rawCpx*rawCpx+rawCpy*rawCpy)||1;
    const pull=Math.min(18, cpLen*0.07);
    const cpx=rawCpx*(1-pull/cpLen), cpy=rawCpy*(1-pull/cpLen);
    const pathD=`M${startPt[0].toFixed(2)},${startPt[1].toFixed(2)} Q${cpx.toFixed(2)},${cpy.toFixed(2)} ${endPt[0].toFixed(2)},${endPt[1].toFixed(2)}`;

    const path=linkG.append('path')
      .attr('fill','none')
      .attr('stroke',color)
      .attr('stroke-width',td.depth===1?1.8:1.2)
      .attr('stroke-opacity',td.depth===1?.5:.3)
      .attr('stroke-linecap','round');

    const len=50; // approximate
    path.attr('d',pathD);
    try{
      const tl=path.node().getTotalLength();
      path.attr('stroke-dasharray',tl).attr('stroke-dashoffset',tl)
        .transition().duration(800).delay(250+td.depth*180+Math.random()*320)
        .attr('stroke-dashoffset',0);
    }catch(e){/* skip animation if error */}
  });

  // Hover only on true pointer devices (not touch)
  const hasHover=window.matchMedia('(hover:hover) and (pointer:fine)').matches;

  // ── NODES ──────────────────────────────────────────
  const nodeG=gMain.append('g').attr('class','nodes');

  root.descendants().forEach(d=>{
    const [x,y]=toXY(d.x,d.y);
    const ng=nodeG.append('g')
      .attr('transform',`translate(${x.toFixed(2)},${y.toFixed(2)})`)
      .attr('opacity',0)
      .attr('class','node-hit')
      .style('cursor','none');

    if(d.depth===0){
      // ── ROOT ───────────────────────────────────────
      ng.append('circle').attr('r',ROOT_R).attr('fill','rgba(255,255,255,.025)').attr('stroke','rgba(255,255,255,.2)').attr('stroke-width',1.5).attr('filter','url(#glow)');
      ng.append('circle').attr('r',ROOT_R-9).attr('fill','rgba(255,255,255,.015)').attr('stroke','rgba(255,255,255,.08)').attr('stroke-width',1);

      // Small icon
      const iconG=ng.append('g').attr('transform','translate(0,-28)scale(0.6)translate(-12,-12)');
      (ICONS.root||[]).forEach(({d:pd})=>{
        iconG.append('path').attr('d',pd).attr('fill','none').attr('stroke','rgba(255,255,255,.4)').attr('stroke-width','1.8').attr('stroke-linecap','round').attr('stroke-linejoin','round');
      });

      // Full title — equal weight across 3 lines
      ng.append('text').text('Nivelamento,')
        .attr('text-anchor','middle').attr('y',-9)
        .attr('fill','rgba(255,255,255,.92)').attr('font-family',"'Syne',sans-serif").attr('font-weight','700').attr('font-size','9.5');
      ng.append('text').text('Gestão de Produtos')
        .attr('text-anchor','middle').attr('y',4)
        .attr('fill','rgba(255,255,255,.92)').attr('font-family',"'Syne',sans-serif").attr('font-weight','700').attr('font-size','9.5');
      ng.append('text').text('e Marcas')
        .attr('text-anchor','middle').attr('y',17)
        .attr('fill','rgba(255,255,255,.92)').attr('font-family',"'Syne',sans-serif").attr('font-weight','700').attr('font-size','9.5');
      // Subtitle
      ng.append('text').text('Mapa Mental')
        .attr('text-anchor','middle').attr('y',30)
        .attr('fill','rgba(238,242,255,.35)').attr('font-family',"'DM Sans',sans-serif").attr('font-size','7').attr('letter-spacing','0.06em');

      ng.on('click',()=>openPanel('marcas'));

    } else if(d.depth===1){
      // ── BRANCH ─────────────────────────────────────
      const color=C[d.data.ckey]||'#fff';
      const ckey=d.data.ckey;

      ng.append('circle').attr('r',BRANCH_R)
        .attr('fill',`url(#rg-${ckey})`)
        .attr('stroke',color).attr('stroke-width',1.5).attr('stroke-opacity',.7)
        .attr('filter','url(#glow)');

      // SVG icon at top of circle
      const iconId=d.data.icon||ckey;
      const iScale=0.72; // 17.3px from 24px
      const iconWrap=ng.append('g')
        .attr('transform',`translate(0,-16)scale(${iScale})translate(-12,-12)`);
      (ICONS[iconId]||[]).forEach(({d:pd})=>{
        iconWrap.append('path').attr('d',pd).attr('fill','none').attr('stroke',color)
          .attr('stroke-width','1.8').attr('stroke-linecap','round').attr('stroke-linejoin','round');
      });

      // Text lines
      const lines=d.data.name.split('\n');
      const baseY = lines.length===1 ? 6 : 0;
      lines.forEach((line,i)=>{
        ng.append('text').text(line)
          .attr('text-anchor','middle')
          .attr('y', baseY + i*13)
          .attr('fill',color).attr('font-family',"'Syne',sans-serif")
          .attr('font-weight','700').attr('font-size','9.5');
      });

      if(hasHover){
        ng.on('mouseenter',function(){
            setCH(true);
            d3.select(this).select('circle').transition().duration(180).attr('r',BRANCH_R+5).attr('stroke-opacity',1);
            showTT(d.data.name.replace('\n',' '), color);
          })
          .on('mouseleave',function(){
            setCH(false);
            d3.select(this).select('circle').transition().duration(180).attr('r',BRANCH_R).attr('stroke-opacity',.7);
            hideTT();
          });
      }
      ng.on('click',()=>openPanel(d.data.id));

    } else {
      // ── LEAF (PILL) ─────────────────────────────────
      const color=C[d.data.ckey]||'#fff';
      const dims=d._dims||leafDims(d.data.name);
      const {w,h,lines}=dims;
      const rx=h/2;

      ng.append('rect')
        .attr('x',-w/2).attr('y',-h/2)
        .attr('width',w).attr('height',h)
        .attr('rx',rx).attr('ry',rx)
        .attr('fill','rgba(255,255,255,.03)')
        .attr('stroke',color).attr('stroke-width',1).attr('stroke-opacity',.4);

      const textBase = lines.length===1 ? 4 : -(lines.length-1)*5.5;
      lines.forEach((line,i)=>{
        ng.append('text').text(line)
          .attr('text-anchor','middle')
          .attr('y', textBase + i*11)
          .attr('fill','rgba(238,242,255,.82)')
          .attr('font-family',"'DM Sans',sans-serif")
          .attr('font-size','8').attr('font-weight','500');
      });

      if(hasHover){
        ng.on('mouseenter',function(){
            setCH(true);
            d3.select(this).select('rect').transition().duration(160)
              .attr('fill','rgba(255,255,255,.07)').attr('stroke-opacity',.9);
            showTT(d.data.name.replace('\n',' '), color);
          })
          .on('mouseleave',function(){
            setCH(false);
            d3.select(this).select('rect').transition().duration(160)
              .attr('fill','rgba(255,255,255,.03)').attr('stroke-opacity',.4);
            hideTT();
          });
      }
      ng.on('click',()=>openPanel(d.data.id));
    }

    // Entrance animation
    ng.transition().duration(550).delay(180+d.depth*220+Math.random()*380).attr('opacity',1);
  });

  buildLegend();
}

/* ══════════════════════════════════════════════════════
   PANEL
══════════════════════════════════════════════════════ */
const overlay=document.getElementById('panel-overlay');
const isMobile=()=>window.innerWidth<=700;

function openPanel(id){
  const data=PC[id]; if(!data) return;
  hideTT(); // dismiss any lingering tooltip
  const color=C[data.ckey]||'#fff';

  // Icon
  const icoEl=document.getElementById('pico');
  icoEl.innerHTML='';
  const svgEl=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svgEl.setAttribute('viewBox','0 0 24 24');
  svgEl.setAttribute('width','22');svgEl.setAttribute('height','22');
  svgEl.setAttribute('fill','none');svgEl.setAttribute('stroke',color);
  svgEl.setAttribute('stroke-width','1.8');svgEl.setAttribute('stroke-linecap','round');svgEl.setAttribute('stroke-linejoin','round');
  (ICONS[data.icon]||[]).forEach(({d})=>{
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d); svgEl.appendChild(p);
  });
  icoEl.appendChild(svgEl);

  document.getElementById('ptitle').textContent=data.title;
  document.getElementById('ptitle').style.color=color;
  document.getElementById('psub').textContent=data.sub;

  const body=document.getElementById('pbody');
  body.style.opacity='1';
  body.style.transition='none';
  body.innerHTML=data.html(color);
  body.scrollTop=0;

  document.getElementById('panel').classList.add('open');

  // Mobile: show overlay and lock scroll
  if(isMobile()){
    overlay.classList.add('show');
    document.body.style.overflow='hidden';
  } else {
    // Desktop: fade in content
    body.style.opacity='0';
    requestAnimationFrame(()=>{
      body.style.transition='opacity .24s';
      body.style.opacity='1';
    });
  }

  if(id==='cvp') setTimeout(drawCVP,120);
}

function closePanel(){
  document.getElementById('panel').classList.remove('open');
  overlay.classList.remove('show');
  document.body.style.overflow='';
}
document.getElementById('pclose').addEventListener('click',closePanel);
overlay.addEventListener('click',closePanel);

/* ══════════════════════════════════════════════════════
   CVP CHART — CORRECTED: proper S-curve rise → peak → fall
══════════════════════════════════════════════════════ */
function drawCVP(){
  const canvas=document.getElementById('cvpC');
  if(!canvas)return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.clientWidth-0;
  const H=160;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  const pad={t:14,r:10,b:8,l:30};
  const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;

  // Phase boundaries (normalized 0-1)
  const phases=[
    {start:0,    end:0.12, color:'#8B949E', label:'Desenv.'},
    {start:0.12, end:0.32, color:C.red,     label:'Introdução'},
    {start:0.32, end:0.60, color:C.gold,    label:'Crescimento'},
    {start:0.60, end:0.78, color:C.teal,    label:'Maturidade'},
    {start:0.78, end:1.00, color:C.rose,    label:'Declínio'},
  ];

  // CVP points: (t, sales) normalized — correct S-curve
  const pts=[
    // Development: flat near zero
    [0.00,0.01],[0.04,0.01],[0.08,0.02],[0.12,0.03],
    // Introduction: slow start
    [0.17,0.06],[0.22,0.11],[0.27,0.18],[0.32,0.27],
    // Growth: rapid acceleration
    [0.38,0.42],[0.44,0.60],[0.50,0.76],[0.56,0.88],[0.60,0.95],
    // Maturity: peak plateau
    [0.64,0.99],[0.68,1.00],[0.72,1.00],[0.75,0.99],[0.78,0.97],
    // Decline: gradual fall
    [0.83,0.88],[0.88,0.74],[0.92,0.58],[0.96,0.42],[1.00,0.28],
  ];

  function ptToCanvas(t,v){
    return [pad.l+t*cw, pad.t+(1-v)*ch];
  }

  // Draw phase background bands
  phases.forEach(ph=>{
    const x1=pad.l+ph.start*cw, x2=pad.l+ph.end*cw;
    const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
    grad.addColorStop(0,ph.color+'18');
    grad.addColorStop(1,ph.color+'04');
    ctx.fillStyle=grad;
    ctx.fillRect(x1,pad.t,x2-x1,ch);
  });

  // Phase separator lines
  [0.12,0.32,0.60,0.78].forEach(t=>{
    const x=pad.l+t*cw;
    ctx.strokeStyle='rgba(255,255,255,.07)';
    ctx.lineWidth=1;
    ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ch);ctx.stroke();
    ctx.setLineDash([]);
  });

  // Axes
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ch);
  ctx.lineTo(pad.l+cw,pad.t+ch);ctx.stroke();

  // Y axis label
  ctx.save();ctx.translate(11,pad.t+ch/2);ctx.rotate(-Math.PI/2);
  ctx.fillStyle='rgba(238,242,255,.28)';ctx.font=`8px 'DM Sans',sans-serif`;ctx.textAlign='center';
  ctx.fillText('VENDAS',0,0);ctx.restore();

  // Convert points to canvas coords
  const canvasPts=pts.map(([t,v])=>ptToCanvas(t,v));

  // Draw filled area (gradient)
  const areaGrad=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
  areaGrad.addColorStop(0,'rgba(0,229,204,.22)');
  areaGrad.addColorStop(0.6,'rgba(255,217,61,.12)');
  areaGrad.addColorStop(1,'rgba(0,229,204,.02)');

  ctx.beginPath();
  ctx.moveTo(canvasPts[0][0],pad.t+ch);
  ctx.lineTo(canvasPts[0][0],canvasPts[0][1]);
  spline(ctx,canvasPts);
  ctx.lineTo(canvasPts[canvasPts.length-1][0],pad.t+ch);
  ctx.closePath();
  ctx.fillStyle=areaGrad;
  ctx.fill();

  // Draw curve (multi-color per phase)
  phases.forEach(ph=>{
    const x1=pad.l+ph.start*cw, x2=pad.l+ph.end*cw;

    ctx.save();
    ctx.beginPath();
    ctx.rect(x1,0,x2-x1,H);
    ctx.clip();

    ctx.beginPath();
    ctx.moveTo(canvasPts[0][0],canvasPts[0][1]);
    spline(ctx,canvasPts);
    ctx.strokeStyle=ph.color;
    ctx.lineWidth=2.5;
    ctx.lineJoin='round';
    ctx.lineCap='round';
    ctx.setLineDash([]);
    ctx.stroke();
    ctx.restore();
  });

  // Phase color dots on top of separators
  [
    [0.06,'#8B949E'],[0.22,C.red],[0.46,C.gold],[0.69,C.teal],[0.89,C.rose]
  ].forEach(([t,col])=>{
    const [cx2,cy2]=ptToCanvas(t, pts.find(([pt])=>Math.abs(pt-t)<0.06)?.[1]||0.5);
    ctx.beginPath();ctx.arc(cx2,cy2,3,0,Math.PI*2);
    ctx.fillStyle=col;ctx.fill();
  });
}

function spline(ctx, pts){
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)];
    const p1=pts[i];
    const p2=pts[i+1];
    const p3=pts[Math.min(pts.length-1,i+2)];
    const cp1x=p1[0]+(p2[0]-p0[0])/6;
    const cp1y=p1[1]+(p2[1]-p0[1])/6;
    const cp2x=p2[0]-(p3[0]-p1[0])/6;
    const cp2y=p2[1]-(p3[1]-p1[1])/6;
    ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,p2[0],p2[1]);
  }
}

function buildLegend(){
  const leg=document.getElementById('leg');
  [[C.red,'Conceitos Básicos'],[C.teal,'Gestão do Produto'],[C.gold,'Diferenciação & Linhas'],[C.vio,'Inovação & CVP'],[C.rose,'Marcas']]
    .forEach(([c,l])=>{
      const el=document.createElement('div');
      el.className='li';
      el.innerHTML=`<div class="ld" style="background:${c}"></div><span>${l}</span>`;

}

/* ══════════════════════════════════════════════════════
   MOBILE — Handle-only swipe to close
   Body scroll is handled purely by CSS (touch-action:pan-y)
   so we NEVER attach non-passive touchmove to #pbody.
══════════════════════════════════════════════════════ */
(function(){
  const handle=document.getElementById('pdrag');
  const panelEl=document.getElementById('panel');
  let startY=0, active=false;

  handle.addEventListener('touchstart',e=>{
    startY=e.touches[0].clientY;
    active=true;
  },{passive:true});

  handle.addEventListener('touchmove',e=>{
    if(!active) return;
    const dy=e.touches[0].clientY-startY;
    if(dy>0){
      panelEl.style.transition='none';
      panelEl.style.transform=`translateY(${Math.min(dy*0.6,240)}px)`;
      if(e.cancelable) e.preventDefault();
    } else {
      active=false;
      panelEl.style.transition='';
      panelEl.style.transform='';
    }
  },{passive:false});

  handle.addEventListener('touchend',e=>{
    if(!active) return;
    active=false;
    const dy=e.changedTouches[0].clientY-startY;
    panelEl.style.transition='';
    panelEl.style.transform='';
    if(dy>80) closePanel();
  },{passive:true});
})();

// Resize handler
window.addEventListener('resize',()=>{
  if(!isMobile()){
    overlay.classList.remove('show');
    document.body.style.overflow='';
  }
  const wrap=document.getElementById('mapw');
  if(svg) d3.select('#mindmap').attr('width',wrap.clientWidth).attr('height',wrap.clientHeight);
});
